name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          skip-dirs: ".venv,node_modules"

      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install and audit
        working-directory: backend
        run: |
          uv sync --extra dev
          # PYSEC-2026-161: starlette 1.0.1 has the fix but is not yet in the
          # Takumi Guard proxy (pypi.flatt.tech). Remove this ignore once
          # starlette >=1.0.1 is available through the proxy.
          uv run pip-audit --ignore-vuln PYSEC-2026-161
        env:
          UV_INDEX_TAKUMI_GUARD_USERNAME: token
          UV_INDEX_TAKUMI_GUARD_PASSWORD: ${{ secrets.TAKUMI_GUARD_TOKEN }}
