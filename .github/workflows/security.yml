name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          skip-dirs: ".venv,node_modules"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install and audit
        working-directory: backend
        run: |
          uv sync --extra dev
          # PYSEC-2026-161: starlette 1.0.1 has the fix but is not yet in the
          # Takumi Guard proxy (pypi.flatt.tech). Remove this ignore once
          # starlette >=1.0.1 is available through the proxy.
          uv run pip-audit --ignore-vuln PYSEC-2026-161
        env:
          UV_INDEX_TAKUMI_GUARD_USERNAME: token
          UV_INDEX_TAKUMI_GUARD_PASSWORD: ${{ secrets.TAKUMI_GUARD_TOKEN }}
